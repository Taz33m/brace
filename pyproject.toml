[project]
name = "brace"
version = "0.1.0"
description = "Brace: what to fix on a building before the storm or fire arrives"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pillow>=10",
    "shapely>=2.0",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "sse-starlette>=2.1",
    "pyshp>=2.3",
    "obstore>=0.12.1",
    "xarray>=2026.9.0",
    "zarr>=3.1.6",
    "deepagents>=0.7.38",
    "langchain-anthropic>=1.7.10",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
